
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Collection - Experiment 8</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1 class="text-primary fw-bold">Book Collection</h1>
            <p class="text-muted">Web Designing - Experiment 8</p>
        </div>

        <div class="card shadow-sm mx-auto mb-4" style="max-width:600px;">
            <div class="card-body p-4">

                <h4 class="mb-3">Add a New Book</h4>

                <form id="bookForm">
                    <input type="text" id="title"
                        class="form-control mb-3"
                        placeholder="Enter book title" required>

                    <input type="text" id="author"
                        class="form-control mb-3"
                        placeholder="Enter author name" required>

                    <button class="btn btn-primary" type="submit">
                        Add Book
                    </button>
                </form>

            </div>
        </div>

        <div class="mx-auto" style="max-width:800px;">
            <h4 class="mb-3">Available Books</h4>
            <div id="bookList" class="row g-3"></div>
        </div>

    </div>

    <script>
        const API = "/api/books";

        async function loadBooks() {
            const response = await fetch(API);
            const books = await response.json();

            const list = document.getElementById("bookList");
            list.innerHTML = "";

            books.forEach(book => {
                list.innerHTML += `
                    <div class="col-md-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-body">
                                <h5>${escapeHTML(book.title)}</h5>
                                <p class="text-muted">
                                    Author: ${escapeHTML(book.author)}
                                </p>
                                <button class="btn btn-warning btn-sm me-2"
                                    onclick="editBook(${book.id})">
                                    Edit
                                </button>
                                <button class="btn btn-danger btn-sm"
                                    onclick="deleteBook(${book.id})">
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        document.getElementById("bookForm").addEventListener(
            "submit", async function(e) {
                e.preventDefault();

                const title = document.getElementById("title").value;
                const author = document.getElementById("author").value;

                await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, author })
                });

                this.reset();
                loadBooks();
            }
        );

        async function editBook(id) {
            const title = prompt("Enter updated book title:");
            if (title === null || !title.trim()) return;

            const author = prompt("Enter updated author name:");
            if (author === null || !author.trim()) return;

            await fetch(`${API}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author })
            });

            loadBooks();
        }

        async function deleteBook(id) {
            if (!confirm("Are you sure you want to delete this book?")) return;

            await fetch(`${API}/${id}`, {
                method: "DELETE"
            });

            loadBooks();
        }

        loadBooks();
    </script>

</body>
</html>
